<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>法律資訊 | Nui Biyori</title>
  <meta name="description" content="ぬい好きのためのやさしいSNS「ぬい日和」のプライバシーポリシー・利用規約。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F8F3ED;
      --surface: #FFFCF8;
      --text-primary: #6B5846;
      --text-secondary: #9A8776;
      --accent: #D8BFA5;
      --accent-soft: #EFE3D7;
      --accent-deep: #B89070;
      --border: #E8DDD2;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      letter-spacing: 0.02em;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      max-width: 520px;
      width: 100%;
    }

    .card {
      padding: 24px 8px;
      text-align: center;
    }

    @media (max-width: 640px) {
      .card {
        padding: 16px 4px;
      }
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: var(--accent-soft);
      color: var(--accent-deep);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Klee One', sans-serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
      letter-spacing: 0.04em;
    }

    .tagline {
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 36px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    a.link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 22px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--text-primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.2s ease;
    }

    a.link-btn:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    a.link-btn .arrow {
      color: var(--accent-deep);
      font-size: 18px;
      transition: transform 0.2s ease;
    }

    a.link-btn:hover .arrow {
      transform: translateX(3px);
    }

    .label-with-icon {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-circle {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .footer {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-secondary);
      letter-spacing: 0.06em;
    }

    /* 繁中版だけの追加（台湾の字形・日本語版/英語版へのリンク・翻訳である旨の注記） */
    html, body { font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif; }
    .header h1, h2, .rule-box .rule { font-family: 'Noto Sans TC', sans-serif; font-weight: 700; }
    .lang-bar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .lang-bar a {
      color: var(--text-secondary);
      text-decoration: none;
      padding: 6px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
    }
    .translation-note {
      font-size: 12px;
      line-height: 1.7;
      color: var(--text-secondary);
      margin: 0 4px 14px;
    }
    p.note { padding-left: 0; text-indent: 0; }
    p.note::before { content: "註："; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="lang-bar"><a href="../index.html" lang="ja">日本語</a><a href="../en/index.html" lang="en">English</a></div>
      <div class="badge">Nui Biyori</div>
      <h1>法律資訊</h1>
      <p class="tagline">給娃娃愛好者的溫柔社群。<br>為了讓你安心使用而準備的文件。</p>
      <div class="links">
        <a class="link-btn" href="./terms.html">
          <span>使用條款</span>
          <span class="arrow">→</span>
        </a>
        <a class="link-btn" href="./guidelines.html">
          <span>發文規範</span>
          <span class="arrow">→</span>
        </a>
        <a class="link-btn" href="./privacy.html">
          <span>隱私權政策</span>
          <span class="arrow">→</span>
        </a>
      </div>
      <p class="translation-note" style="margin-top:16px">本頁為日文原文的翻譯，僅供參考。若兩者內容有所不同，以日文版為準。</p>
      <div class="footer">© Nui Biyori</div>
    </div>
  </div>
</body>
</html>
